<!DOCTYPE html>
<html>
<head>
    <title>Análise Facial</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-card" style="width: 500px;">
        <h2>Verificação de Expressão</h2>
        <video id="video" autoplay></video>
        <h1 id="resultado">---</h1>
        <button onclick="capturar()">Analisar Agora</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const resultText = document.getElementById('resultado');

        // Liga a Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream);

        async function capturar() {
            resultText.innerText = "Pensando...";
            
            // Desenha o frame atual em um canvas invisível
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const base64Image = canvas.toDataURL('image/jpeg');

            // Envia para o Flask
            const response = await fetch('/analisar_expressao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });

            const data = await response.json();
            const mensagens = {
            'Feliz': "Que bom te ver feliz! Continue assim!",
            'Triste': "Sinto que as coisas estão difíceis. Quer conversar?",
            'Raiva': "Respire fundo... O que está te incomodando?",
            'Normal': "Você parece focado hoje. No que está pensando?"
    };

resultText.innerText = mensagens[data.emocao] || "Estou te observando...";
            resultText.innerText = data.emocao || "Erro";
        }
    </script>
</body>
</html>
